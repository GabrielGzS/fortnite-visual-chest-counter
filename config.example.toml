# Fortnite Visual Chest Counter - OPTIONAL settings
# ------------------------------------------------------------------------------------------
# You do NOT need this file. Without it the program uses the defaults shown here.
# To change something: copy this file, rename the copy to  config.toml  (same folder as the
# program), edit it with Notepad, save, and start the counter again.
# Anything you leave out keeps its default. A typo shows a warning and uses the default.
# Lines starting with # are comments.

[detector]
# Which languages Fortnite is set to. "en" = English (CHEST), "pt" = Portuguese (Brazil) (BAU). The app's Settings page
# sets this for you (English / Portuguese (Brazil) / Both).
# Use only the language your Fortnite is set to, e.g.  languages = ["en"]  (the other word is not needed and only
# adds a small risk of false alarms; on our English test videos it made no difference).
languages = ["en", "pt"]

# How many pictures per second are analysed (5-30). The app's Settings page offers 15 (Recommended - what the detector
# was built and tested with), 10 (Balanced) and 5 (Performance). Fewer pictures can miss chests: on our test recordings
# 10 found the same chests but added a few extra APPROX counts, and 5 missed some chests.
process_fps = 15

# Which strong detections go into the CERTAIN count:
#   "HIGH"    = high and very-high confidence (default)
#   "CERTAIN" = only the very-high ones (stricter; CERTAIN will be lower)
# Either way, every certain chest is also included in APPROX.
certain_min_tier = "HIGH"

# APPROX is the estimated TOTAL (it already includes the certain chests). These switches
# decide which weaker evidence is allowed to add to APPROX only.
count_supported_medium_as_approx = true     # medium popup + the "open chest" button + a chest-looking object
count_interaction_object_as_approx = true   # button + chest-looking object, even if the popup was missed
medium_counts_alone_languages = ["en"]      # languages whose medium-confidence popup counts by itself

[display]
# What your viewers see. EASIEST: the Overlay page of the app - it writes these lines for you.
# The counter only writes TEXT FILES (in the obs_output folder); OBS shows them with a "Text (GDI+)" source that has
# "Read from file" ticked. Fonts, colours and size are set in OBS, not here.
#
# The two numbers:
#   CERTAIN = chests detected with strong evidence
#   APPROX  = the estimated TOTAL, which already INCLUDES the certain ones (never add them together)
#
# Use ONE file in OBS: obs_output\chest_counter.txt - every display choice below is written there, so you never change
# the OBS source. (Other files, for advanced layouts with separately styled sources: certain_chests.txt = always the
# certain_text, approximate_chests.txt = always the approx_text, chest_status.txt = legacy one-line file,
# last_chest.txt = the most recent chest.)

# What chest_counter.txt shows:
#   show = "approx"                              -> only approx_text  (the estimated total)
#   show = "certain"                             -> only certain_text
#   show = "both" and both_layout = "stacked"    -> certain_text on the first line, approx_text on the second
#   show = "both" and both_layout = "inline"     -> one line: combined_status_format
show = "both"
both_layout = "stacked"

# Your own wording. {count} is where the number goes. You may also use {certain} and {approx} anywhere.
# Any text, symbols and emoji are fine (whether emoji display depends on the font you pick in OBS).
# For a literal { or } write {{ or }}.   For a second line inside one text, write \n
# Examples:
#   approx_text = "Chests opened: {count}"
#   approx_text = "Chest Hunt: {count}/500"
#   certain_text = "Confirmed: {count}"
certain_text = "CERTAIN OPENED CHESTS: {count}"
approx_text = "APPROX. OPENED CHESTS: {count}"

# The one-line text (show = "both" + both_layout = "inline"). Placeholders: {certain} and {approx}
combined_status_format = "{certain} certain • ~{approximate} estimated"

# true -> 1,232      false -> 1232
use_thousands_separator = true

[console]
# The black counter window (not what viewers see).
#   "minimal" -> only chests that were counted, plus warnings and errors
#   "normal"  -> also pop-ups that were NOT counted (red) and a status line every few seconds
#   "debug"   -> everything, with the full reason for each decision (useful when reporting a problem)
verbosity = "normal"
# Coloured lines: green = certain chest, yellow = approx-only chest, red = not counted, white-on-red = error.
# Set to false for plain text.
colors = true

[state]
# Keep the counts when the program is closed and reopened.
persist = true
path = "state/chest_state.json"
# Folder where the OBS text files are written.
obs_dir = "obs_output"

[logging]
enabled = true
# Also record detections that were NOT counted (useful when reporting a problem).
log_candidates = true
# Save a small picture of the pop-up area for every pop-up the counter considered (counted or not) into
# logs/snapshots/. Turn on if you want to report missed or wrong chests: the pictures show exactly what it saw.
save_snapshots = false
dir = "logs"

[capture]
# Diagnostic recording (advanced, OFF by default): records exactly what the counter analyses, so a missed or wrong chest
# can be replayed and checked later. Easiest: the app's Settings page. Mark a moment with Ctrl+Alt+M (app) or M (console).
#   "off"     = nothing is recorded (the default)
#   "marks"   = keep only the video around your marks (smallest; a short rolling buffer on disk)
#   "events"  = keep the video around every chest decision and every mark
#   "session" = keep the whole session (large: about 10 GB per hour)
mode = "off"
# "standard" (about 10 GB per hour of kept video) or "lossless" (exact replay of what the counter saw, about 22 GB per hour)
quality = "standard"
before_seconds = 10
after_seconds = 10
mark_before_seconds = 30
mark_after_seconds = 10
# Folder for the recordings (one sub-folder per counting session).
dir = "captures"

[match]
# Match tracking (experimental, ON by default; the app's Settings page sets this). English games only for now.
#   "off"    = nothing runs
#   "shadow" = follow the match and only write what it sees to the session log in logs/. It needs [logging] enabled.
#              It never changes your counts, your profiles, the OBS text or the app.
#   "on"     = also keep a history of your matches and chests in state/history/ (the default). It needs saving turned on in [state].
#              Your counts and the OBS text stay exactly as they would be with this off.
mode = "on"
# Only for mode = "on": how often running totals are saved, in seconds: 30, 60 (recommended), 300 or 600. Matches are still followed
# once a second whatever this is. A longer interval writes less, but after a crash more of the last moments count as uncertain.
heartbeat_seconds = 60

[live]
# Where the video comes from (the app's Video source list sets this for you; most used first):
#   "stream"     = a Twitch / YouTube livestream URL (set "url" below) - no OBS needed. Video can arrive in bursts or
#                  pause to buffer; the app reconnects by itself and keeps the counts
#   "desktop"    = capture a monitor (set "monitor" below): play the stream or the game fullscreen on it - a small player
#                  inside a web page is too small to read
#   "obs-camera" = OBS Virtual Camera (your own stream's OBS scene; single PC, or a second PC fed over SRT)
#   "device"     = a capture card opened directly (set "device" below) - less tested: not yet with a physical card
#   "window"     = an OBS "Windowed Projector (Source)" window (when OBS owns the capture card and the Virtual Camera is
#                  used by another app; set "window" below) - less tested: not yet with a real OBS projector
source = "stream"
# Only for source = "device": the exact device name (the app's Video source list sets it for you).
device = "OBS Virtual Camera"
# Only for source = "desktop": which monitor (1 = the first).
monitor = 1
# Only for source = "window": the projector window's exact title, e.g. "Windowed Projector (Source) - Capture Card".
# Keep that window open (it may be behind other windows, but not minimized).
window = ""
# Only for source = "stream": the live stream's link, e.g. "https://www.twitch.tv/CHANNEL" or a YouTube watch?v= link.
url = ""
# Only for source = "stream": "720p" (recommended), "1080p" (about 4x the decoding CPU) or "480p" (not recommended).
stream_quality = "720p"
# How often the status line is printed, in seconds.
status_interval_seconds = 5

[obs_websocket]
# OPTIONAL: besides writing obs_output\chest_counter.txt, put the same text straight into a Text source in OBS through
# OBS's built-in WebSocket server (OBS 28+: Tools -> WebSocket Server Settings -> Enable WebSocket server). Updates show
# at once and no file path is needed. Easiest: the app's Overlay page. The text file is written either way.
# The password is NOT stored here: the app keeps it in Windows Credential Manager.
enabled = false
# The PC running OBS: 127.0.0.1 = this PC. For OBS on another PC use its IPv4 address (and allow TCP port 4455 there).
host = "127.0.0.1"
port = 4455
# The Text source to update (its name in OBS). The app also remembers its OBS id, so renaming it in OBS is followed.
source = ""
source_uuid = ""

[app]
# The desktop app reopens with the size, position and maximised state it was closed with (saved in state/window.json).
# false = always open at the default size. If the saved place is no longer on any screen, the window is moved back.
remember_window = true
# The live preview on the Dashboard. It only shows what the counter already analyses, and never changes what is counted.
show_preview = true
# Analytics: count the +1s you made for a match (Dashboard > Game) in chests per minute and per match. A -1 always counts there, because it
# takes off a chest that should not have been counted. false = rates stay what the detector measured. Your totals include both either way.
analytics_include_manual = false

[update]
# Look for a new version shortly after the app opens. Nothing is downloaded or installed unless you choose to.
check_automatically = true
# How fast an update you chose to download may go:
# "adaptive"  = about 1 MB/s while the app is counting, no limit otherwise. It follows counting; it does not measure your connection.
# "unlimited" = never limited.   "custom" = always limited to custom_limit_kb_per_second.
download_bandwidth = "adaptive"
# Only for download_bandwidth = "custom": kilobytes per second, from 50 to 1000000.
custom_limit_kb_per_second = 2000

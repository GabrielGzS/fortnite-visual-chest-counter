name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows · full suite
            suite: full
          - os: ubuntu-latest
            name: Linux · portable backend
            suite: portable
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            packaging/build-requirements.txt
            pyproject.toml

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install FFmpeg and Qt system libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1 libopengl0 libxcb-cursor0

      - name: Install pinned runtime and test dependencies
        run: python -m pip install -r packaging/build-requirements.txt -e ".[dev]"

      - name: Run tests outside the checkout
        shell: python
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          checkout = Path(os.environ["GITHUB_WORKSPACE"])
          work = Path(os.environ["RUNNER_TEMP"]) / "chest-counter-tests"
          reports = Path(os.environ["RUNNER_TEMP"]) / "test-results"
          work.mkdir(parents=True, exist_ok=True)
          reports.mkdir(parents=True, exist_ok=True)
          os.environ["FCC_HOME"] = str(work)
          tests = checkout / "tests"
          if os.environ["TEST_SUITE"] == "full":
              targets = [tests]
          else:
              names = (
                  "test_basics.py", "test_cases.py", "test_types.py", "test_stream.py",
                  "test_profiles.py", "test_logging_reload.py", "test_match_history.py",
                  "test_match_stats.py", "test_group_live.py", "test_discord_scoreboard.py",
                  "test_discord_rate_limit.py", "test_overlay_layout.py", "test_review_timing.py",
                  "test_french_qualified_layout.py", "test_diagnostics_cleanup.py",
              )
              targets = [tests / name for name in names]
          report = reports / (os.environ["RUNNER_OS"] + ".xml")
          command = [sys.executable, "-m", "pytest", *map(str, targets),
                     "-q", "--tb=short", "--junitxml=" + str(report)]
          sys.exit(subprocess.call(command, cwd=work))

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ runner.os }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
